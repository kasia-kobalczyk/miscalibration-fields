[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "calib-atlas"
version = "0.1.0"
description = "Miscalibration fields: estimating input-dependent, signed calibration error in a learned representation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
	"torch>=2.1",
	"numpy>=1.24",
	"scipy>=1.10",
	"pandas>=2.0",
	"scikit-learn>=1.3",
	"matplotlib>=3.7",
	"relplot",
	"datasets>=2.16",
	"hydra-core>=1.3",
	"omegaconf>=2.3",
	"pyyaml>=6.0",
	"tqdm>=4.66",
	"wandb>=0.16",
]

[project.optional-dependencies]
# Extracting confidences and embeddings from Hugging Face LLMs (generate_real_data).
llm = [
	"transformers>=4.50",
	"accelerate>=0.26",
]
# Running the notebooks.
notebooks = [
	"jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
